<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Floci Upload Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #222; }
    form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 16px; border: 1px dashed #aaa; border-radius: 8px; }
    button { padding: 8px 16px; cursor: pointer; }
    .result { margin-top: 16px; padding: 12px; background: #f4f6f8; border-radius: 8px; word-break: break-all; }
    .result img { max-width: 100%; margin-top: 8px; border-radius: 6px; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Upload a file</h1>
  <p>The file is stored in Floci S3 and you get back a link served by this app.</p>

  <form id="form">
    <input type="file" name="file" accept="image/jpeg,image/png,image/webp,application/pdf" required>
    <button type="submit">Upload</button>
  </form>

  <div id="results"></div>

  <script>
    const form = document.getElementById('form');
    const results = document.getElementById('results');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const box = document.createElement('div');
      box.className = 'result';
      box.textContent = 'Uploading...';
      results.prepend(box);

      const res = await fetch('/upload', { method: 'POST', body: new FormData(form) });
      const data = await res.json();
      if (!res.ok) {
        box.innerHTML = `<span class="error">${data.error}</span>`;
        return;
      }
      box.innerHTML = `<strong>Stored.</strong> Link: <a href="${data.link}" target="_blank">${data.link}</a>
        <br><small>${data.type}, ${(data.size / 1024).toFixed(1)} KB</small>`;
      if (data.type.startsWith('image/')) {
        box.innerHTML += `<br><img src="${data.link}" alt="uploaded image">`;
      }
      form.reset();
    });
  </script>
</body>
</html>
