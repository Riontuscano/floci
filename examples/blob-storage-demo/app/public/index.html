<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Floci File Storage</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div>
      <h1>File storage</h1>
      <p class="muted">Files are stored in Floci S3. Links are served by this app.</p>
    </div>
    <div class="header-right">
      <nav class="nav">
        <a href="/" class="active">Files</a>
        <a href="/events.html">Events</a>
      </nav>
      <div class="status">
        <span id="health" class="dot" title="Checking..."></span>
        <span id="stats" class="muted">Loading...</span>
      </div>
    </div>
  </header>

  <section class="panel network">
    <div>
      <strong>Network</strong>
      <span id="network-info" class="muted">Detecting...</span>
    </div>
    <label>
      Image quality
      <select id="quality-mode">
        <option value="auto">Auto (by network)</option>
        <option value="low">Low: 320px, q50</option>
        <option value="medium">Medium: 640px, q70</option>
        <option value="high">High: up to 1600px, q85</option>
      </select>
    </label>
    <span id="profile-info" class="badge"></span>
  </section>

  <section class="panel">
    <label id="dropzone" class="dropzone">
      <input id="file-input" type="file" multiple accept="image/jpeg,image/png,image/webp,application/pdf">
      <strong>Drop files here or click to choose</strong>
      <span id="limits" class="muted">JPEG, PNG, WEBP or PDF</span>
    </label>
    <label class="check">
      <input id="compress" type="checkbox" checked>
      Compress photos in the browser before upload (max 2048px)
    </label>
    <ul id="queue" class="queue"></ul>
  </section>

  <section>
    <h2>Gallery</h2>
    <div id="gallery" class="gallery"></div>
    <p id="empty" class="muted" hidden>No files yet. Upload one above.</p>
    <button id="load-more" hidden>Load more</button>
  </section>

  <dialog id="viewer">
    <div class="viewer-head">
      <strong id="viewer-title"></strong>
      <button id="viewer-close" aria-label="Close">✕</button>
    </div>
    <div id="viewer-stage" class="viewer-stage">
      <img id="viewer-img" alt="">
    </div>
    <div class="viewer-controls">
      <span>Load as:</span>
      <button data-profile="low">Low</button>
      <button data-profile="medium">Medium</button>
      <button data-profile="high">High</button>
      <button data-profile="original">Original</button>
    </div>
    <p id="viewer-info" class="muted"></p>
    <code id="viewer-url"></code>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js" type="module"></script>
</body>
</html>
