services:
  floci:
    image: floci/floci:2.0.1
    # No "ports:" on purpose. Floci is reachable only from the app container on this
    # private Docker network, never from your browser or the network.
    environment:
      FLOCI_STORAGE_MODE: memory
      FLOCI_STORAGE_SERVICES_S3_MODE: wal
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    volumes:
      # A name ("floci-data") is a Docker volume; a path ("/srv/blob/floci") is a host folder.
      - ${FLOCI_DATA:-floci-data}:/app/data
    restart: unless-stopped

  app:
    build: ./app
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      S3_ENDPOINT: http://floci:4566
      S3_BUCKET: ${S3_BUCKET:-demo-uploads}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DB_PATH: /app/data/files.db
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-15}
      MAX_FILES_PER_REQUEST: ${MAX_FILES_PER_REQUEST:-10}
      ALLOWED_SIZES: ${ALLOWED_SIZES:-160,320,640,1024,1600}
      MAX_CONCURRENT_RESIZES: ${MAX_CONCURRENT_RESIZES:-2}
    volumes:
      - ${APP_DATA:-app-data}:/app/data
    depends_on:
      floci:
        condition: service_healthy
    restart: unless-stopped

volumes:
  floci-data:
  app-data:
