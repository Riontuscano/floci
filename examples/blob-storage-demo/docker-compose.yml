# Log rotation for both containers, so logs can never fill the server's disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  floci:
    image: floci/floci:2.0.1
    # No "ports:" on purpose. Floci is reachable only from the app container on this
    # private Docker network, never from your browser or the network.
    environment:
      FLOCI_STORAGE_MODE: memory
      FLOCI_STORAGE_SERVICES_S3_MODE: wal
      FLOCI_STORAGE_SERVICES_SQS_MODE: wal
      FLOCI_STORAGE_SERVICES_SNS_MODE: wal
      # Queue URLs returned by Floci use this name, which the app container can resolve.
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    volumes:
      # A name ("floci-data") is a Docker volume; a path ("/srv/blob/floci") is a host folder.
      - ${FLOCI_DATA:-floci-data}:/app/data
    # Hard caps so this stack cannot starve other services on the same machine.
    mem_limit: ${FLOCI_MEMORY:-1g}
    cpus: ${FLOCI_CPUS:-1.0}
    logging: *logging
    restart: unless-stopped

  app:
    build: ./app
    ports:
      - "${APP_PORT:-6100}:6100"
    environment:
      S3_ENDPOINT: http://floci:4566
      S3_BUCKET: ${S3_BUCKET:-demo-uploads}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DB_PATH: /app/data/files.db
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-15}
      MAX_FILES_PER_REQUEST: ${MAX_FILES_PER_REQUEST:-10}
      STORAGE_QUOTA_GB: ${STORAGE_QUOTA_GB:-0}
      ALLOWED_NETWORKS: ${ALLOWED_NETWORKS:-}
      ALLOWED_SIZES: ${ALLOWED_SIZES:-160,320,640,1024,1600}
      MAX_CONCURRENT_RESIZES: ${MAX_CONCURRENT_RESIZES:-2}
      THUMBNAIL_SIZES: ${THUMBNAIL_SIZES:-320,640}
      MAX_RECEIVE_COUNT: ${MAX_RECEIVE_COUNT:-3}
      ALERT_LARGE_FILE_MB: ${ALERT_LARGE_FILE_MB:-5}
    volumes:
      - ${APP_DATA:-app-data}:/app/data
    mem_limit: ${APP_MEMORY:-512m}
    cpus: ${APP_CPUS:-1.0}
    logging: *logging
    depends_on:
      floci:
        condition: service_healthy
    restart: unless-stopped

volumes:
  floci-data:
  app-data:
